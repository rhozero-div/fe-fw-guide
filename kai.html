<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>火焰纹章 万缕千丝 · 凯伊线 外传 / 抓捕 / 挖角攻略</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#1f2430; --ink2:#5b6472; --ink3:#8b94a3;
  --line:#e4e7ec; --line2:#eef0f4;
  --accent:#8a5a14; --accent-soft:#fdf4e3; --accent-line:#e6cf9e;
  --blue:#1d4ed8; --blue-soft:#eaf0ff;
  --green:#166534; --green-soft:#e8f5ec;
  --red:#b42318; --red-soft:#fdeceb;
  --purple:#6d28d9; --purple-soft:#f2ecfe;
  --teal:#0f766e; --teal-soft:#e6f6f4;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.62;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
h1,h2,h3,h4,h5{margin:0;font-weight:700;letter-spacing:.2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px 90px}

header{background:linear-gradient(135deg,#1d2433 0%,#2c3550 55%,#3b2f1e 100%);color:#fff;padding:22px 0 0}
.hd{max-width:1240px;margin:0 auto;padding:0 18px}
.hd h1{font-size:21px;letter-spacing:.5px}
.hd .sub{color:#c9d0e0;font-size:12.5px;margin-top:5px}
.hd .sub b{color:#f5c86b;font-weight:600}
.kpis{display:flex;gap:22px;flex-wrap:wrap;margin-top:14px}
.kpi{display:flex;align-items:baseline;gap:6px}
.kpi b{font-size:19px;color:#f5c86b;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:#b9c2d4}
nav{display:flex;gap:4px;margin-top:16px;flex-wrap:wrap}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:#c3cadb;padding:10px 16px;
  font-size:14px;cursor:pointer;font-family:inherit;font-weight:600}
nav button.on{color:#fff;border-bottom-color:#f5c86b}
nav button:hover{color:#fff}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:14px}
.card>h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h4{font-size:13.5px;margin:14px 0 6px;color:var(--ink)}
.muted{color:var(--ink2)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11.5px;border:1px solid var(--line);
  background:#fafbfc;color:var(--ink2);margin:2px 4px 2px 0;white-space:nowrap}
.tag.acc{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tag.blue{background:var(--blue-soft);border-color:#c9d6ff;color:var(--blue)}
.tag.green{background:var(--green-soft);border-color:#c6e4d1;color:var(--green)}
.tag.red{background:var(--red-soft);border-color:#f5cdc9;color:var(--red)}
.tag.purple{background:var(--purple-soft);border-color:#ddd0fb;color:var(--purple)}
.tag.teal{background:var(--teal-soft);border-color:#bfe3de;color:var(--teal)}
.tag.grey{background:#f2f4f7;color:var(--ink3)}
.warn{background:#fff8e6;border:1px solid var(--accent-line);border-radius:8px;padding:9px 12px;
  font-size:12.5px;color:#7a5510;margin:10px 0}
.info{background:#eef4ff;border:1px solid #cfdcff;border-radius:8px;padding:10px 13px;font-size:12.5px;color:#24406e;margin:10px 0}
.danger{background:var(--red-soft);border:1px solid #f5cdc9;border-radius:8px;padding:10px 13px;font-size:12.5px;color:var(--red);margin:10px 0}
.hr{height:1px;background:var(--line2);margin:14px 0}

.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line2);vertical-align:top}
th{background:#f4f6f9;color:var(--ink2);font-weight:700;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:2}
tbody tr:hover{background:#fafbfd}
td.c{text-align:center;font-variant-numeric:tabular-nums}
td.nm{font-weight:700;white-space:nowrap}
tr.grp td{background:#f7f9fc;font-weight:700;font-size:12px;color:var(--ink2);border-bottom:1px solid var(--line)}
.bar-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
select,input[type=text]{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;
  background:#fff;font-family:inherit;color:var(--ink);outline:none}
input[type=text]:focus,select:focus{border-color:var(--accent)}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:12.5px;
  cursor:pointer;font-family:inherit;color:var(--ink2)}
.chip.on{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent);font-weight:700}
.req{display:inline-block;background:var(--accent-soft);border:1px solid var(--accent-line);color:var(--accent);
  border-radius:6px;padding:0 7px;font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums}
.req.b{background:var(--blue-soft);border-color:#c9d6ff;color:var(--blue)}
.req.g{background:var(--green-soft);border-color:#c6e4d1;color:var(--green)}
.req.r{background:var(--red-soft);border-color:#f5cdc9;color:var(--red)}

/* gantt */
.gantt{margin-top:14px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:16px 16px 8px;overflow:auto}
.grow{display:grid;grid-template-columns:186px 1fr;gap:10px;align-items:center;margin-bottom:7px;min-width:660px}
.glab{font-size:12.5px;font-weight:700;white-space:nowrap}
.glab i{display:block;font-style:normal;font-weight:400;color:var(--ink3);font-size:11px}
.gtrack{position:relative;height:20px;background:#f7f9fc;border-radius:5px;border:1px solid var(--line2)}
.gseg{position:absolute;top:2px;bottom:2px;border-radius:4px;font-size:10px;color:#fff;display:flex;
  align-items:center;justify-content:center;overflow:hidden;white-space:nowrap;text-indent:-9999px}
.gseg.a{background:#c98a2e}.gseg.b{background:#b42318}.gseg.c{background:#0f766e}.gseg.d{background:#6d28d9}
.gaxis{position:relative;height:22px;margin-left:196px;min-width:660px}
.gaxis span{position:absolute;font-size:10.5px;color:var(--ink3);transform:translateX(-50%)}

/* paralogue cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:13px;margin-top:12px}
.pcard{border:1px solid var(--line);border-radius:11px;background:#fff;padding:14px 16px;position:relative}
.pcard.tight{border-color:#f0c9c4;box-shadow:0 0 0 3px #fdf1f0 inset}
.pcard .t1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard .ttl{font-weight:700;font-size:15px}
.pcard .en{font-size:11.5px;color:var(--ink3);margin-top:1px}
.pcard dl{margin:9px 0 0;font-size:12.5px;display:grid;grid-template-columns:62px 1fr;gap:5px 9px}
.pcard dt{color:var(--ink3)}
.pcard dd{margin:0}
.dw{white-space:pre-line;font-size:12.5px;background:#fafbfd;border:1px solid var(--line2);border-radius:8px;
  padding:7px 10px;margin-top:8px;font-variant-numeric:tabular-nums}

/* battle blocks */
.bblock{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:14px;overflow:hidden}
.bhead{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px 18px;
  background:linear-gradient(90deg,#fbfaf6,#fff);border-bottom:1px solid var(--line2);flex-wrap:wrap}
.bhead .bt{font-size:15.5px;font-weight:700}
.bhead .bs{font-size:12px;color:var(--ink3);margin-top:2px}
.bbody{padding:6px 18px 16px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:6px 22px}
ul.ck{margin:6px 0 0;padding-left:0;list-style:none;font-size:12.5px}
ul.ck li{position:relative;padding-left:22px;margin-bottom:5px}
ul.ck li:before{content:"";position:absolute;left:0;top:4px;width:13px;height:13px;border-radius:4px;
  border:1.5px solid var(--accent-line);background:var(--accent-soft)}
ul.dt{margin:6px 0 0;padding-left:17px;font-size:12.5px}
ul.dt li{margin-bottom:5px}
ul.dt li::marker{color:var(--accent)}
.step{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:12.5px;margin-top:8px}
.step b{color:var(--teal);white-space:nowrap}

/* mount table */
table.mt{font-size:12.5px}
table.mt th,table.mt td{padding:7px 9px}
table.mt td:nth-child(3),table.mt td:nth-child(4),table.mt td:nth-child(5),table.mt td:nth-child(8){white-space:nowrap}
table.mt th:nth-child(9),table.mt td:nth-child(9){min-width:216px}

/* recruit summary */
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}
.bigc{border:1px solid var(--line);border-radius:11px;background:#fff;padding:14px 16px}
.bigc .n{font-size:26px;font-weight:800;color:var(--accent);line-height:1.1;font-variant-numeric:tabular-nums}
.bigc .l{font-size:12.5px;color:var(--ink2);margin-top:3px}
.bigc .x{font-size:12px;color:var(--ink3);margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
footer{max-width:1240px;margin:0 auto;padding:26px 18px 60px;color:var(--ink3);font-size:11.5px}
@media(max-width:640px){
  .wrap{padding:0 12px 70px}.hd h1{font-size:18px}
  nav button{padding:9px 10px;font-size:13px}
  .grow{grid-template-columns:120px 1fr}.gaxis{margin-left:132px}
}
</style>
</head>

function gantt(){
  // 轴：9/17 起，10 月按 30 天计；总跨度 9/17 → 10/21
  const idx = (m,d)=> (+m===9) ? (+d-17) : (14 + +d);
  const TOTAL = idx(10,21);
  const pct = v => (v/TOTAL*100).toFixed(2)+"%";
  const cls = {ss7:"a", ss6:"c", ss8:"b", ss1:"d"};
  const rows = PARA.map(p=>{
    const segs=[];
    const push=(w)=>{
      const a=idx(w[0][0],w[0][1]), b=idx(w[1][0],w[1][1]);
      const lab=w[0][0]+"/"+w[0][1]+"–"+w[1][0]+"/"+w[1][1];
      segs.push(`<div class="gseg ${cls[p.id]||"a"}" style="left:${pct(a)};width:${pct(b-a+1)}" title="${lab}">${lab}</div>`);
    };
    push(p.win); if(p.win2) push(p.win2);
    const txt = p.win[0][0]+"/"+p.win[0][1]+"–"+p.win[1][0]+"/"+p.win[1][1]
      + (p.win2 ? " ／ "+p.win2[0][0]+"/"+p.win2[0][1]+"–"+p.win2[1][0]+"/"+p.win2[1][1] : "");
    return `<div class="grow"><div class="glab">${esc(p.char)}<i>${esc(txt)}</i></div>
      <div class="gtrack">${segs.join("")}</div></div>`;
  }).join("");
  const ticks=[[0,"9/17"],[7,"9/24"],[15,"10/1"],[22,"10/8"],[29,"10/15"],[35,"10/21"]]
    .map(([v,l])=>`<span style="left:${pct(v)}">${l}</span>`).join("");
  return `<div class="gantt">${rows}<div class="gaxis">${ticks}</div></div>`;
}

/* ---------- Tab4 挖角 ---------- */
function parseRec(){
  return REC.filter(x=>x.route==="凯伊").map(x=>{
    const rn = x.renown||"";
    const isNum = /^\d+$/.test(rn);
    const chm = /第(\d+)章/.exec(x.chapter||"");
    const dm = /难度\s*([高中低超]+)/.exec(x.cond||"");
    const parts = (x.cond||"").split("|");
    const head = parts[0]||"";
    const tail = parts.slice(1).join(" ").trim();
    // 交换条件 vs 交涉条件：给东西/付钱 = 代价；完成委托/答题/抛硬币 = 附加条件
    const isPay = t => /^(支付|给|交|消耗)/.test(t) || /[×xX\*]\s*\d/.test(t);
    let cost = "", extra = "";
    if(tail){ (isPay(tail) ? (cost=tail) : (extra=tail)); }
    let h = head.replace(/^凯伊：/,"").replace(/支援LV\d、?/,"").replace(/名声LV\d+、?/,"")
                .replace(/需交涉（难度[^）]*）/,"").replace(/、$/,"").trim();
    if(h) extra = extra ? (h+"；"+extra) : h;
    let place = (x.when||"").replace(/\s*需满足挖角条件/,"")
                .replace(/，?满足名声、支援及对应交涉条件后招募。?/,"")
                .replace(/返回帝都后，在第6章自由行动期/,"第6章自由行动期")
                .trim();
    return {
      name:x.name, renown:isNum?+rn:null, support:+((x.support||"").replace(/\D/g,"")||0),
      ch: chm?+chm[1]:null, diff:(dm?dm[1]:""), cost, cond:extra, place, raw:rn
    };
  });
}
function bonusTable(){
  const rows = REC.filter(x=>x.route==="凯伊" && !/^\d+$/.test(x.renown||""))

let recQ = "", recOnly = false;

    if(recOnly && !["佩佩","乌修拉","迪雅各"].includes(r.name)) return false;
    if(!recQ) return true;
    const s=(r.name+r.cond+r.cost+r.place).toLowerCase();
    return s.includes(recQ.toLowerCase());
  }).sort((a,b)=> a.ch-b.ch || a.renown-b.renown);
  let html="", lastCh=null;
  for(const r of list){
    if(r.ch!==lastCh){

    const dTone = {"超":"r","高":"r","中":"acc","低":"g"}[r.diff]||"grey";
    const isLock = ["佩佩","乌修拉","迪雅各"].includes(r.name);

      <td class="small">${esc(r.place||"—")}</td>
    </tr>`;
  }
  return `<div class="bar-tools">
      <input type="text" id="recq" placeholder="搜角色 / 素材 / 地名" value="${esc(recQ)}">
      <button class="chip${recOnly?" on":""}" id="reconly">只看外传前置的 3 人</button>

}

    ${recTable()}
  </div>

  <div class="card"><h3>口径说明</h3>
    <div class="small muted">
      ① 本章挖角数据取自 fireemblem.top 的逐路线挖角表（每线各自的名声 / 支援 / 最早章节），与旧版「角色出现章节」口径不同，旧数据会让人误以为第 3 章就能挖名声 10 的角色。<br>
      ② 名字译法有分歧时以中文 wiki 为准：贝特兰 = 贝特朗，谭利穆恩 = 塔利穆恩，欧露赫露 = 奥尔谢尔。<br>
      ③ 「第X章」是攻略站标注的最早可挖章节（附页参考），不是硬性限制；名声不够时晚一两章照样能挖。
    </div>
  </div>`;
}

/* ---------- 渲染 ---------- */
function render(){
  document.getElementById("nav").innerHTML = TABS.map(t=>
    `<button data-tab="${t.id}" class="${t.id===cur?"on":""}">${t.name}</button>`).join("");
  const app = document.getElementById("app");
  if(cur==="para") app.innerHTML = tabPara();
  else if(cur==="battle") app.innerHTML = tabBattle();
  else if(cur==="mount") app.innerHTML = tabMount();
  else app.innerHTML = tabRec();
  bind();
}
function bind(){
  document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{cur=b.dataset.tab;if(history.replaceState)history.replaceState(null,"","#"+cur);else location.hash=cur;render();window.scrollTo({top:0,behavior:"smooth"});});
  document.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{mType=b.dataset.mt;render();});
  const q=document.getElementById("recq");
  if(q) q.oninput=()=>{recQ=q.value;const p=q.selectionStart;render();const q2=document.getElementById("recq");q2.focus();q2.setSelectionRange(p,p);};
  const ro=document.getElementById("reconly");
  if(ro) ro.onclick=()=>{recOnly=!recOnly;render();};
}
render();
</script>
</body>
</html>
